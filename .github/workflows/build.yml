name: Build & Release

on:
  workflow_dispatch: # 手动触发
  push:
    tags:
      - "v*" # 推送 v* 标签时自动构建并发布 Release

permissions:
  contents: write # softprops/action-gh-release 创建 Release 需要

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: docling-gui-windows-x64
          - os: ubuntu-latest
            asset: docling-gui-linux-x64
          - os: macos-latest
            asset: docling-gui-macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 先装 CPU 版 torch/torchaudio：否则 Linux 上会拉 CUDA 版（多下几个 GB）。
      # macOS 的官方 torch 本身就是 CPU/MPS 构建，无需专门处理。
      - name: Install dependencies
        shell: bash # windows-latest 的默认 shell 是 PowerShell，跑不了 bash 的 if 语法
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" != "macOS" ]; then
            pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -r requirements.txt
          pip install pyinstaller python-docx python-pptx openpyxl pillow

      - name: Install Linux system libs (Qt runtime)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0

      - name: Build
        run: pyinstaller docling-gui.spec --noconfirm

      - name: "Smoke test (headless: --version + real conversion)"
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if [ -d dist/docling-gui/docling-gui.app ]; then
            BIN="dist/docling-gui/docling-gui.app/Contents/MacOS/docling-gui"
          elif [ -f dist/docling-gui/docling-gui.exe ]; then
            BIN=dist/docling-gui/docling-gui.exe
          else
            BIN=dist/docling-gui/docling-gui
          fi
          "$BIN" --version
          python tests/make_sample.py tests/_sandbox/sample.docx
          "$BIN" --cli tests/_sandbox
          test -f tests/_sandbox/sample.md
          "$BIN" --cli --out tests/_sandbox/out2 tests/_sandbox/sample.docx
          test -f tests/_sandbox/out2/sample.md
          echo "SMOKE OK: $BIN"

      - name: Zip artifact
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip ../${{ matrix.asset }}.zip docling-gui
          else
            zip -qry ../${{ matrix.asset }}.zip docling-gui
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

      - name: Create Release and upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}.zip
          generate_release_notes: true
