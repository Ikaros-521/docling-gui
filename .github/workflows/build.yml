name: Build & Release

on:
  workflow_dispatch: # 手动触发
  push:
    tags:
      - "v*" # 推送 v* 标签时自动构建并发布 Release

permissions:
  contents: write # softprops/action-gh-release 创建 Release 需要

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: docling-gui-windows-x64
          - os: ubuntu-latest
            asset: docling-gui-linux-x64
          - os: macos-latest
            asset: docling-gui-macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 先装 CPU 版 torch/torchvision/torchaudio：否则 Linux 上会拉 CUDA 版
      #（多下几个 GB），且 torchvision 与 +cpu torch 混装会因算子库不匹配
      # 报 "operator torchvision::nms does not exist"（PDF 布局模型加载即炸）。
      # macOS 的官方 torch 本身就是 CPU/MPS 构建，无需专门处理。
      - name: Install dependencies
        shell: bash # windows-latest 的默认 shell 是 PowerShell，跑不了 bash 的 if 语法
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" != "macOS" ]; then
            pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -r requirements.txt
          pip install pyinstaller python-docx python-pptx openpyxl pillow

      - name: Install Linux system libs (Qt runtime)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libglib/libgssapi 是 PyInstaller 收集 qfluentwidgets 与 Qt hook
          # 导入 PySide6.QtNetwork 的构建期依赖；其余为 Qt 运行时常见依赖
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 \
            libglib2.0-0 libgssapi-krb5-2 libfontconfig1 libdbus-1-3 libgl1 \
            || sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 \
            libglib2.0-0t64 libgssapi-krb5-2 libfontconfig1 libdbus-1-3 libgl1

      # 下载 PDF/图片管线默认模型（布局 docling-layout-heron + 表格 tableformer
      # + OCR rapidocr），打进产物实现离线转换。目录布局必须符合 docling 约定：
      # HF 仓库按 repo_id.replace('/', '--')，rapidocr 由 docling-tools 落到 RapidOcr/
      - name: Download docling models (bundled for offline use)
        run: |
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          snapshot_download(
              "docling-project/docling-layout-heron",
              local_dir="models/docling-project--docling-layout-heron",
              ignore_patterns=[".cache/**"],
          )
          snapshot_download(
              "docling-project/docling-models",
              local_dir="models/docling-project--docling-models",
              allow_patterns=["model_artifacts/tableformer/**"],
              ignore_patterns=[".cache/**"],
          )
          print("models ready")
          EOF
          docling-tools models download rapidocr --rapidocr-backend-lang torch:ch -o models
          ls models/RapidOcr

      - name: Build
        run: pyinstaller docling-gui.spec --noconfirm

      - name: "Smoke test (full format matrix, offline via bundled models)"
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if [ -d dist/docling-gui/docling-gui.app ]; then
            BIN="dist/docling-gui/docling-gui.app/Contents/MacOS/docling-gui"
          elif [ -f dist/docling-gui/docling-gui.exe ]; then
            BIN=dist/docling-gui/docling-gui.exe
          else
            BIN=dist/docling-gui/docling-gui
          fi
          "$BIN" --version
          pip install reportlab
          python tests/gen_samples.py tests/_samples
          "$BIN" --cli tests/_samples --out tests/_samples_out
          fail=0
          for stem in pdf docx pptx xlsx csv html adoc epub eml ics vtt tex jats png; do
            if [ ! -f "tests/_samples_out/$stem.md" ]; then
              echo "MISSING OUTPUT: $stem.md"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo "SMOKE FAILED: $BIN"
            exit 1
          fi
          echo "SMOKE OK: $BIN (14 formats converted)"

      - name: Zip artifact
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip ../${{ matrix.asset }}.zip docling-gui
          else
            zip -qry ../${{ matrix.asset }}.zip docling-gui
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

      # 模型单独打包上传（只跑一次，避免重名冲突）：供不想用内置模型的用户，
      # 解压后设 DOCLING_ARTIFACTS_PATH 指向解压目录即可
      - name: Zip models package
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        run: |
          zip -qry docling-models.zip models -x "models/*/.cache/*"
          du -sh docling-models.zip

      - name: Create Release and upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}.zip
          generate_release_notes: true

      - name: Upload models package to Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: docling-models.zip
