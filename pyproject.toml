[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docx2md-gui"
version = "0.1.0"
description = "递归批量把 Word(.docx) 转成 Markdown（同路径输出），基于 docling，跨平台 GUI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ikaros-521" }]
dependencies = [
    "docling>=2.15.0",
    "PySide6>=6.6.0",
]

[project.scripts]
docx2md = "docx2md_gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
